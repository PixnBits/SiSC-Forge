# Single-candidate bulk NbN phonon campaign for real Quantum ESPRESSO runs.
#
# Prerequisites:
#   - pw.x on PATH (ph.x for DFPT; Ubuntu 6.7 ph.x may crash — see SETUP.md)
#   - Pseudopotentials for Nb and N (SSSP)
#   - For phonopy_fd: pip/uv install phonopy
#
# Dry-run (no QE):
#   siscforge run --dry-run examples/nbn_phonon_qe.yaml
#
# Real QE (Ubuntu apt: use phonopy_fd until QE ≥ 7.2 is built):
#   siscforge run --calculator qe examples/nbn_phonon_qe.yaml
#
# See docs/examples/nbN_phonon_qe.md and docs/SETUP.md.

name: nbn_phonon_qe
description: >
  Golden-system bulk rocksalt NbN: optional vc-relax skipped by default;
  SCF + Gamma-point DFPT phonon for dynamical-stability check.
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - tm_nitride
  formulas:
    - NbN
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe
    parameters: {}

dft:
  engine: qe
  ecutwfc: 50.0
  ecutrho: 400.0
  kpoints: [4, 4, 4]
  conv_thr: 1.0e-8
  occupations: smearing
  smearing: mv
  degauss: 0.02
  # REQUIRED for real runs — directory of *.upf files
  #pseudo_dir: /usr/share/espresso/pseudo
  pseudo_dir: /usr/share/espresso/pseudo
  # Optional explicit map (overrides auto-guess from pseudo_dir):
  # pseudopotentials:
  #   Nb: Nb.pbe-spn-kjpaw_psl.1.0.0.UPF
  #   N:  N.pbe-n-kjpaw_psl.1.0.0.UPF
  do_relax: false
  do_phonon: true
  # Ubuntu 6.7 ph.x often aborts (buffer overflow). Prefer phonopy FD on that stack.
  # Use phonon_method: gamma or dfpt when you have a working QE ≥ 7.2 build.
  #phonon_method: phonopy_fd
  phonon_method: gamma
  phonopy_supercell: [2, 2, 2]
  phonopy_distance: 0.01
  quality_tag: screening
  nproc: 1
  # Short scratch path avoids long outdir strings
  #work_dir: /tmp/siscforge_qe/nbn_phonon
  work_dir: /tmp/siscforge_qe/nbn

ranking:
  performance_weight: 0.5
  si_feasibility_weight: 0.5
  prefer_dynamically_stable: true

output_dir: outputs/nbn_phonon_qe
export_formats:
  - json
  - csv
