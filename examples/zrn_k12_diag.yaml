# ZrN ε=0 — k=12³ diagnostic (FINISHED). Same q=4³, ecut=60.
# Ladder: k=4³ → −148.7; k=8³ → −72.1; k=12³ → −29.3 (finite-q collapsed
# to Γ-noise scale). k is no longer the dominant lever for this cell.
# Soft-mode class stays likely_mesh_artefact. Still no EPW. Do not
# --force-rerun this finished dyn set.
#
# docker run --rm -it -v "$PWD:/workspace" -w /workspace --cpus=16 \
#   siscforge:latest siscforge run --calculator qe examples/zrn_k12_diag.yaml

name: zrn_k12_diag
description: >
  Single-cell ZrN ε=0 DFPT at q=4×4×4 with SCF k=12×12×12, ecutwfc=60.
  Closed the electronic-sampling ladder: min ω −29.3 cm⁻¹ (Γ-noise scale).
  Do not --force-rerun. Still not a stability / EPW certificate.
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - tm_nitride
  metals:
    - Zr
  ternary_metals: []
  x_values: []
  formulas:
    - ZrN
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe

formation_filter:
  enabled: false

surrogate:
  tc_lambda:
    enabled: false

active_learning:
  enabled: false

dft:
  engine: qe
  pseudo_dir: /usr/share/espresso/pseudo
  ecutwfc: 60.0
  ecutrho: 480.0
  kpoints: [12, 12, 12]
  qpoints: [4, 4, 4]
  conv_thr: 1.0e-8
  occupations: smearing
  smearing: mv
  degauss: 0.02
  nbnd: 48
  do_relax: true
  do_phonon: true
  do_epw: false
  epw:
    enabled: false
  phonon_method: dfpt
  phonon_retry_on_d_matrix: true
  tr2_ph: 1.0e-10
  ph_alpha_mix: 0.1
  ph_nmix: 12
  ph_niter: 150
  quality_tag: screening
  nproc: 16

ranking:
  performance_weight: 0.35
  si_feasibility_weight: 0.65
  prefer_dynamically_stable: true

run:
  resume: true
  continue_on_error: true
  force_rerun: false
  resume_qe_steps: true
  heartbeat_seconds: 900
  estimate_walltime: true

output_dir: outputs/zrn_k12_diag
export_formats:
  - json
  - csv
  - markdown
