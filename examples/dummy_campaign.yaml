# Minimal SiSC-Forge campaign for CLI smoke / dry-run demos.
# Usage:
#   siscforge run --dry-run examples/dummy_campaign.yaml

name: dummy_nitride_dry_run
description: >
  Tiny mock campaign over a few TM nitrides under mild epitaxial strain.
  No DFT is executed; the mock calculator fills schema-valid placeholders.
version: "0.1"
dry_run: true

enumeration:
  material_families:
    - tm_nitride
  formulas:
    - NbN
    - TiN
    - ZrN
    - Nb0.5Ti0.5N
  substrates:
    - Si(001)
  strain_values:
    - 0.0
    - -0.01
  max_candidates: 5

calculators:
  - name: mock
    parameters:
      note: dry-run only

ranking:
  # P2.4 multi-objective weights (renormalized by sum). Defaults preserve legacy order.
  performance_weight: 0.6          # Tc-like axis; normalized by performance_ceiling_K
  si_feasibility_weight: 0.4       # Si-feasibility.total (0–100)
  uncertainty_weight: 0.0          # optional certainty (1−surrogate u); 0 = off
  performance_ceiling_K: 40.0      # K; maps performance_score → 0–100
  pareto_enabled: true             # mark non-dominated on perf vs Si (+ certainty if weighted)
  prefer_dynamically_stable: true

josephson:
  enabled: false

output_dir: outputs/dummy_nitride_dry_run
export_formats:
  - json
  - csv
