[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siscforge"
# Authoritative package version. src/siscforge/__init__.py reads this via
# importlib.metadata (fallback string in __init__.py must stay in lockstep).
version = "0.4.3"
description = "High-throughput materials discovery platform for silicon-compatible superconductors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "SiSC-Forge Contributors" },
]
keywords = [
    "superconductivity",
    "materials-discovery",
    "silicon",
    "high-throughput",
    "DFT",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pymatgen>=2024.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# jobflow is optional: recipes run sequentially without a job store.
# Quantum ESPRESSO binaries (pw.x, ph.x) must be installed separately.
qe = [
    "jobflow>=0.1.0",
]
phonopy = [
    "phonopy>=2.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jobflow>=0.1.0",
]

[project.scripts]
siscforge = "siscforge.cli.main:run"

[project.urls]
Homepage = "https://github.com/PixnBits/SiSC-Forge"
Documentation = "https://github.com/PixnBits/SiSC-Forge/tree/main/docs"
Repository = "https://github.com/PixnBits/SiSC-Forge"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# typer.Option / typer.Argument in defaults is the idiomatic Typer pattern
ignore = ["B008"]
