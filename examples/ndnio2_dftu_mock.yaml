# P3.1 dry-run: DFT+U mock path for an infinite-layer nickelate-style candidate.
# Usage:
#   siscforge run --dry-run examples/ndnio2_dftu_mock.yaml
#
# Does NOT run real QE, Wannier, or TRIQS. Exercises DFTUResult → store → export.

name: ndnio2_dftu_mock
description: >
  Phase 3.1 smoke campaign — mock DFT+U (Hubbard) result for NdNiO2-like
  nickelate. Conventional nitride campaigns leave dft.do_dftu false (default).
version: "0.1"
dry_run: true

enumeration:
  material_families: [nickelate]
  candidate_specs:
    - formula: NdNiO2
      material_family: nickelate
      substrate: SrTiO3
      in_plane_strain: 0.0
      metadata:
        prototype: infinite_layer
      # Minimal infinite-layer prototype (P1 cell; screening only)
      structure_cif: |
        data_NdNiO2
        _symmetry_space_group_name_H-M   'P 1'
        _cell_length_a   3.92000000
        _cell_length_b   3.92000000
        _cell_length_c   3.31000000
        _cell_angle_alpha   90.00000000
        _cell_angle_beta   90.00000000
        _cell_angle_gamma   90.00000000
        _symmetry_Int_Tables_number   1
        _chemical_formula_structural   NdNiO2
        _chemical_formula_sum   'Nd1 Ni1 O2'
        loop_
         _symmetry_equiv_pos_site_id
         _symmetry_equiv_pos_as_xyz
          1  'x, y, z'
        loop_
         _atom_site_type_symbol
         _atom_site_label
         _atom_site_symmetry_multiplicity
         _atom_site_fract_x
         _atom_site_fract_y
         _atom_site_fract_z
         _atom_site_occupancy
          Nd  Nd0  1  0.00000000  0.00000000  0.50000000  1
          Ni  Ni1  1  0.50000000  0.50000000  0.00000000  1
          O  O2  1  0.00000000  0.50000000  0.00000000  1
          O  O3  1  0.50000000  0.00000000  0.00000000  1
  max_candidates: 1

calculators:
  - name: mock

dft:
  engine: mock
  do_phonon: false
  do_epw: false
  do_dftu: true
  dftu:
    enabled: true
    U_eV: 5.0
    J_eV: 0.8
    hubbard_species: [Ni]
    hubbard_projectors: ortho-atomic
    nspin: 2
    starting_magnetization:
      Ni: 0.5

formation_filter:
  enabled: false

ranking:
  performance_weight: 0.5
  si_feasibility_weight: 0.5

output_dir: outputs/ndnio2_dftu_mock
export_formats: [json, csv, markdown]
