# Bulk NbN EPW + isotropic Tc (Phase 1)
#
# Dry-run (mock e-ph moments, no QE/EPW):
#   siscforge run --dry-run examples/nbn_epw.yaml
#
# Real EPW (requires pw.x, ph.x, epw.x, Wannier90, UPF for Nb+N):
#   # set dft.pseudo_dir below
#   siscforge run --calculator qe-epw examples/nbn_epw.yaml
#
# See docs/examples/nbN_epw.md

name: nbn_epw_screening
description: >
  Single-candidate bulk rocksalt NbN: SCF + phonon + EPW screening grids
  with Allen–Dynes / isotropic Eliashberg Tc.
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - tm_nitride
  formulas:
    - NbN
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe-epw

formation_filter:
  enabled: false

dft:
  engine: qe-epw
  # PAW Nb needs a bit more cutoff + empty bands for multi-q DFPT/EPW.
  ecutwfc: 60.0
  ecutrho: 480.0
  kpoints: [6, 6, 6]
  qpoints: [2, 2, 2]
  # Short vc-relax helps EPW avoid the PAW d_matrix symmetry crash seen on
  # some ibrav=0 CIF-reoriented cells (still screening-level soft modes).
  do_relax: true
  do_phonon: true
  do_epw: true
  # EPW path forces multi-q ldisp + fildvscf using epw.nqc.
  phonon_method: dfpt
  nbnd: 28
  tr2_ph: 1.0e-10
  ph_alpha_mix: 0.1
  ph_nmix: 12
  ph_niter: 150
  degauss: 0.02
  # Label only — denser grids need explicit nkf/nqf/qpoints overrides
  # (see docs/examples/nbN_epw.md "Tightening grids").
  quality_tag: screening
  pseudo_dir: /usr/share/espresso/pseudo
  epw:
    enabled: true
    # Screening fine mesh; workstation denser: [12,12,12] + qpoints/nqc [4,4,4]
    nkf: [6, 6, 6]
    nqf: [6, 6, 6]
    nkc: [4, 4, 4]
    nqc: [2, 2, 2]  # must match dft.qpoints
    nbndsub: 10
    mu_star: 0.10
    eliashberg: true
    allen_dynes_fallback: true
    # Slightly wider FS window for coarse screening meshes
    fsthick: 0.6
    degaussw: 0.1
    degaussq: 0.05
    # Raise above default (5) to temper soft-mode λ inflation under screening DFPT
    eps_acustic: 15.0

ranking:
  performance_weight: 0.65
  si_feasibility_weight: 0.35
  prefer_dynamically_stable: true

output_dir: outputs/nbn_epw_screening
export_formats:
  - json
  - csv
  - markdown
