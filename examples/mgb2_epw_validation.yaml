# Bulk MgB₂ EPW + isotropic Tc (Phase 1 workstation validation)
#
# Dry-run (mock e-ph moments, no QE/EPW):
#   siscforge run --dry-run examples/mgb2_epw_validation.yaml
#
# Real EPW (requires pw.x, ph.x, epw.x, Wannier90, UPF for Mg+B):
#   siscforge run --calculator qe-epw examples/mgb2_epw_validation.yaml
#
# See docs/examples/mgb2_epw.md
# Requires dft.nosym: true (SCF+PH+NSCF) for EPW after #89/#90.

name: mgb2_epw_validation
description: >
  Single-candidate bulk hexagonal MgB2: SCF + phonon + EPW screening grids
  with Allen–Dynes / isotropic Eliashberg Tc (isotropic average of two-gap physics).
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - mgb2_boride
  formulas:
    - MgB2
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe-epw

formation_filter:
  enabled: false

dft:
  engine: qe-epw
  # Light elements: moderate cutoffs for workstation screening
  ecutwfc: 50.0
  ecutrho: 400.0
  kpoints: [6, 6, 4]
  qpoints: [2, 2, 2]
  # Experimental lattice is stable; skip expensive vc-relax for the golden dry path
  do_relax: false
  do_phonon: true
  phonon_retry_on_d_matrix: true
  phonon_retry_on_fft_symmetry: true
  # Pipeline-wide nosym: SCF + PH + EPW NSCF (avoids gmap_sym after Wannier
  # when nosym-only NSCF meets symmetry-DFPT). ph.x has no nosym namelist —
  # dft.nosym forces search_sym=.false. and pw.x nosym/noinv on SCF.
  nosym: true
  # QE 7.3.1 segfaults in divide_class/prepare_sym_analysis on this cell;
  # search_sym=.false. skips that path (also forced by nosym above).
  ph_search_sym: false
  do_epw: true
  phonon_method: dfpt
  # Empty bands for B-p / Wannier (screening)
  nbnd: 20
  tr2_ph: 1.0e-10
  ph_alpha_mix: 0.2
  ph_nmix: 8
  ph_niter: 100
  degauss: 0.02
  # Label only — denser grids: docs/examples/mgb2_epw.md "Tightening grids"
  quality_tag: screening
  nproc: 16
  # Override on your machine (SSSP PBE efficiency for Mg and B — same library).
  # Explicit pins for reproducibility. Auto-resolve is safe for B vs Ba after
  # the prefix-boundary fix; do not mix PAW + USPP on this cell.
  pseudo_dir: /usr/share/espresso/pseudo
  # GBRV B (b_pbe_v1.4.uspp.F.UPF) + PAW Mg was the mix seen in the QE 7.3.1
  # divide_class crash. Prefer a consistent SSSP pair:
  pseudopotentials:
    Mg: Mg.pbe-n-kjpaw_psl.0.3.0.UPF
    B: B.pbe-n-kjpaw_psl.0.1.UPF
  epw:
    enabled: true
    # Screening; workstation denser: nkf/nqf [16,16,12], nqc/qpoints [4,4,2]
    nkf: [8, 8, 6]
    nqf: [8, 8, 6]
    nkc: [4, 4, 2]
    nqc: [2, 2, 2]  # must match dft.qpoints
    # QE 7.3.1 EPW/examples/mgb2/epw/epw.in projections (not proj=random)
    auto_nbndsub: false
    nbndsub: 5
    wannier_projections: "B:pz;f=0.5,1.0,0.5:s;f=0.0,0.5,0.5:s;f=0.5,0.5,0.5:s"
    mu_star: 0.10
    eliashberg: true
    allen_dynes_fallback: true
    fsthick: 0.5
    degaussw: 0.05
    degaussq: 0.05
    eps_acustic: 5.0

ranking:
  performance_weight: 0.70
  si_feasibility_weight: 0.30
  prefer_dynamically_stable: true

run:
  resume: true
  continue_on_error: true
  force_rerun: false
  resume_qe_steps: true
  heartbeat_seconds: 900
  estimate_walltime: true

output_dir: outputs/mgb2_epw_validation
export_formats:
  - json
  - csv
  - markdown
