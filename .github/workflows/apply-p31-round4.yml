name: apply-p31-round4
on:
  push:
    branches: [feat/p3.1-dftu-result]
    paths:
      - ".github/patches/p31-round4.patch"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3.1-dftu-result
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply DFT+U round-4 patch and cleanup
        run: |
          set -euo pipefail
          if [ ! -f .github/patches/p31-round4.patch ]; then
            echo "Patch already consumed; nothing to do"
            exit 0
          fi
          git apply .github/patches/p31-round4.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patches/p31-round4.patch
          rm -f .github/workflows/apply-p31-round4.yml
          rmdir .github/patches 2>/dev/null || true
          git add -A
          git status
          git commit -m "fix(dftu): synthesis-card None formatting + CLI alias param preference"
          git push origin HEAD:feat/p3.1-dftu-result
