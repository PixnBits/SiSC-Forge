# P3.3 dry-run: mock solid_dmft-style DMFT on NdNiO2-like path.
# Usage:
#   siscforge run --dry-run examples/ndnio2_dmft_mock.yaml
#
# Does NOT run real QE, Wannier90, or TRIQS. Exercises
# DFT+U → Wannier (ready_for_dmft) → DMFTResult → store → export.
# Pairing → performance_score is out of scope (P3.4).
#
# Mock occupancy (~8.65–8.95) and mass enhancement (~2.4–4) are
# illustrative / deterministic placeholders, NOT literature-validated
# NdNiO2 numbers. Do not treat them as a calibrated DMFT result.

name: ndnio2_dmft_mock
description: >
  Phase 3.3 smoke campaign — mock DMFT (occupancy + mass enhancement)
  for NdNiO2-like nickelate. Mock numbers are illustrative placeholders,
  not a literature fit. Conventional nitride campaigns leave
  dft.do_dmft false (default). P3.4 pairing mapping is out of scope.
version: "0.1"
dry_run: true

enumeration:
  material_families: [nickelate]
  candidate_specs:
    - formula: NdNiO2
      material_family: nickelate
      substrate: SrTiO3
      in_plane_strain: 0.0
      metadata:
        prototype: infinite_layer
      structure_cif: |
        data_NdNiO2
        _symmetry_space_group_name_H-M   'P 1'
        _cell_length_a   3.92000000
        _cell_length_b   3.92000000
        _cell_length_c   3.31000000
        _cell_angle_alpha   90.00000000
        _cell_angle_beta   90.00000000
        _cell_angle_gamma   90.00000000
        _symmetry_Int_Tables_number   1
        _chemical_formula_structural   NdNiO2
        _chemical_formula_sum   'Nd1 Ni1 O2'
        loop_
         _symmetry_equiv_pos_site_id
         _symmetry_equiv_pos_as_xyz
          1  'x, y, z'
        loop_
         _atom_site_type_symbol
         _atom_site_label
         _atom_site_symmetry_multiplicity
         _atom_site_fract_x
         _atom_site_fract_y
         _atom_site_fract_z
         _atom_site_occupancy
          Nd  Nd0  1  0.00000000  0.00000000  0.50000000  1
          Ni  Ni1  1  0.50000000  0.50000000  0.00000000  1
          O  O2  1  0.00000000  0.50000000  0.00000000  1
          O  O3  1  0.50000000  0.00000000  0.00000000  1
  max_candidates: 1

calculators:
  - name: mock

dft:
  engine: mock
  do_phonon: false
  do_epw: false
  do_dftu: true
  dftu:
    enabled: true
    U_eV: 5.0
    J_eV: 0.8
    hubbard_species: [Ni]
    hubbard_projectors: ortho-atomic
    nspin: 2
  do_wannier: true
  wannier:
    enabled: true
    projection_mode: random
    auto_num_wann: true
    num_wann: 10
    screening_tight_froz: true
    kmesh: [4, 4, 4]
    require_chk: true
  do_dmft: true
  dmft:
    enabled: true
    solver: mock
    U_eV: 5.0
    J_eV: 0.8
    beta: 40.0
    n_cycles: 10000
    n_warmup_cycles: 2000
    n_loops: 4
    # Documented dry-run bypass (solver=mock). Real solvers still require
    # wannier.ready_for_dmft unless allow_without_wannier_gate: true.
    mock_bypass_gate: true
    allow_without_wannier_gate: false

formation_filter:
  enabled: false

ranking:
  performance_weight: 0.5
  si_feasibility_weight: 0.5

output_dir: outputs/ndnio2_dmft_mock
export_formats: [json, csv, markdown]
