# COMPATIBILITY ALIAS — prefer examples/mgb2_epw.yaml for new work.
# Kept so older docs/scripts that reference the skeleton name still dry-run.
#
# Dry-run:
#   siscforge run --dry-run examples/mgb2_epw.yaml
#
# See docs/examples/mgb2_epw.md

name: mgb2_epw_skeleton
description: >
  Compatibility alias for the Phase 1 MgB2 golden campaign.
  Prefer examples/mgb2_epw.yaml.
version: "0.1"
dry_run: true

enumeration:
  material_families:
    - mgb2_boride
  formulas:
    - MgB2
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: mock

formation_filter:
  enabled: false

dft:
  engine: qe-epw
  do_relax: false
  do_phonon: true
  do_epw: true
  quality_tag: screening
  pseudo_dir: null
  epw:
    enabled: true
    nkf: [8, 8, 6]
    nqf: [8, 8, 6]
    nkc: [4, 4, 2]
    nqc: [2, 2, 2]
    mu_star: 0.10
    eliashberg: true
    allen_dynes_fallback: true

ranking:
  performance_weight: 0.70
  si_feasibility_weight: 0.30

output_dir: outputs/mgb2_epw_skeleton
export_formats:
  - json
  - csv
  - markdown
