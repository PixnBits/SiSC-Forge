# NbN ε=0 — k=12³ / q=4³ diagnostic (Slice 29.5 / #72).
# Twin of examples/zrn_k12_diag.yaml. Same settings that closed the ZrN
# electronic-sampling ladder (k=12³, q=4³, ecutwfc=60). Phonon-only
# control: one lever (composition). Decide whether the raised nitride
# phonon k-policy generalises before any family-wide map.
#
# ZrN ε=0 ladder (Docker QE 7.3.1): k=4³/−148.7 → k=8³/−72.1 →
# k=12³/−29.3 (finite-q collapsed to Γ-noise). Residual −29.3 is mild
# Γ acoustic numerical noise (consistent with _GAMMA_MILD_CM1).
#
# Literature caveat: harmonic instability / extreme softness is often
# reported for *ideal stoichiometric* δ-NbN (rock-salt). Experimental
# superconducting NbN is typically N-deficient; recent work invokes
# anharmonicity. A dense-k harmonic result that remains substantially
# soft is therefore not automatically another mesh artefact. Record
# the numbers honestly either way. Do not invent expected min-ω.
#
# Control experiment — not a production claim and not an EPW run.
# Do not launch EPW. Do not --force-rerun finished dyn sets (this
# store or the ZrN diagnostics).
#
# docker run --rm -it -v "$PWD:/workspace" -w /workspace --cpus=16 \
#   siscforge:latest siscforge run --calculator qe examples/nbn_k12_diag.yaml

name: nbn_k12_diag
description: >
  Single-cell NbN ε=0 DFPT at q=4×4×4 with SCF k=12×12×12, ecutwfc=60.
  Binary control after Slice 29.4: same settings as the closed ZrN
  ladder. Phonon-only. Do not --force-rerun. Not a stability / EPW
  certificate. Stoichiometric δ-NbN may remain harmonic-soft in the
  literature — record min ω honestly.
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - tm_nitride
  metals:
    - Nb
  ternary_metals: []
  x_values: []
  formulas:
    - NbN
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe

formation_filter:
  enabled: false

surrogate:
  tc_lambda:
    enabled: false

active_learning:
  enabled: false

dft:
  engine: qe
  pseudo_dir: /usr/share/espresso/pseudo
  ecutwfc: 60.0
  ecutrho: 480.0
  kpoints: [12, 12, 12]
  qpoints: [4, 4, 4]
  conv_thr: 1.0e-8
  occupations: smearing
  smearing: mv
  degauss: 0.02
  nbnd: 48
  do_relax: true
  do_phonon: true
  do_epw: false
  epw:
    enabled: false
  phonon_method: dfpt
  phonon_retry_on_d_matrix: true
  tr2_ph: 1.0e-10
  ph_alpha_mix: 0.1
  ph_nmix: 12
  ph_niter: 150
  quality_tag: screening
  nproc: 16

ranking:
  performance_weight: 0.35
  si_feasibility_weight: 0.65
  prefer_dynamically_stable: true

run:
  resume: true
  continue_on_error: true
  force_rerun: false
  resume_qe_steps: true
  heartbeat_seconds: 900
  estimate_walltime: true

output_dir: outputs/nbn_k12_diag
export_formats:
  - json
  - csv
  - markdown
