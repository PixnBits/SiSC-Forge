# Bulk MgB₂ EPW + isotropic Tc (Phase 1 golden)
#
# Preferred path (validated): ibrav=4 hexagonal (auto from #92) + symmetry-on
# SCF/PH + EPW NSCF via epw.nscf_nosym: false. Live store campaign
# mgb2_epw_validation_ibrav4_nscf_sym → λ≈0.46, Tc≈7.5 K (screening grids).
#
# Dry-run (mock e-ph moments, no QE/EPW):
#   siscforge run --dry-run examples/mgb2_epw.yaml
#
# Real EPW (requires pw.x, ph.x, epw.x, Wannier90, UPF for Mg+B):
#   siscforge run --calculator qe-epw examples/mgb2_epw.yaml
#
# See docs/examples/mgb2_epw.md

name: mgb2_epw_screening
description: >
  Single-candidate bulk hexagonal MgB2: SCF + phonon + EPW screening grids
  with Allen–Dynes / isotropic Eliashberg Tc (isotropic average of two-gap physics).
version: "0.1"
dry_run: false

enumeration:
  material_families:
    - mgb2_boride
  formulas:
    - MgB2
  substrates:
    - Si(001)
  strain_values:
    - 0.0
  max_candidates: 1

calculators:
  - name: qe-epw

formation_filter:
  enabled: false

dft:
  engine: qe-epw
  # Light elements: moderate cutoffs for workstation screening
  ecutwfc: 45.0
  ecutrho: 360.0
  kpoints: [6, 6, 4]
  qpoints: [2, 2, 2]
  # Experimental lattice is stable; skip expensive vc-relax for the golden dry path
  do_relax: false
  do_phonon: true
  # Golden: keep crystal symmetry (default nosym=false, ph_search_sym=true).
  # Hexagonal MgB2 uses ibrav=4 + celldm (#92). If ph.x still hits divide_class /
  # prepare_sym_analysis, phonon_retry_on_search_sym (default true) retries once
  # with search_sym=.false. — do not require pipeline dft.nosym for the golden.
  # Fallback only: dft.nosym / ph_search_sym: false / gmap_sym remediation.
  do_epw: true
  phonon_method: dfpt
  # Empty bands for B-p / Wannier (screening)
  nbnd: 20
  tr2_ph: 1.0e-10
  ph_alpha_mix: 0.2
  ph_nmix: 8
  ph_niter: 100
  degauss: 0.02
  # Label only — denser grids: docs/examples/mgb2_epw.md "Tightening grids"
  quality_tag: screening
  # SSSP PBE efficiency names (PAW). Override if your pseudo_dir differs.
  # Do not mix PAW + USPP on this cell — that mix was implicated in the
  # QE 7.3.1 divide_class crash. Explicit pins also survive a dirty pseudo_dir.
  pseudo_dir: /usr/share/espresso/pseudo
  pseudopotentials:
    Mg: Mg.pbe-n-kjpaw_psl.0.3.0.UPF
    B: B.pbe-n-kjpaw_psl.0.1.UPF
  epw:
    enabled: true
    # Sym NSCF matching SCF/PH (upstream EPW/examples/mgb2). Default None/True
    # would force nosym NSCF (#89) and can trip gmap_sym after Wannier.
    nscf_nosym: false
    # Screening; workstation denser: nkf/nqf [16,16,12], nqc/qpoints [4,4,2]
    nkf: [8, 8, 6]
    nqf: [8, 8, 6]
    nkc: [4, 4, 2]
    nqc: [2, 2, 2]  # must match dft.qpoints
    nbndsub: 8
    mu_star: 0.10
    eliashberg: true
    allen_dynes_fallback: true
    fsthick: 0.5
    degaussw: 0.05
    degaussq: 0.05
    eps_acustic: 5.0

ranking:
  performance_weight: 0.70
  si_feasibility_weight: 0.30
  prefer_dynamically_stable: true

output_dir: outputs/mgb2_epw_screening
export_formats:
  - json
  - csv
  - markdown
